html,body{margin:0;height:100%}
body{background:#fff;color:var(--ink);font:24px/1.4 "Trebuchet MS","Segoe UI",Arial,sans-serif;display:flex}

.prep{background:var(--tint);border-radius:10px;padding:10px 16px;margin:0 0 12px}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}

.pic{display:block;width:100%;max-width:380px;height:auto;background:#fff;border:2px solid var(--red);border-radius:12px;margin:0 0 12px}

.rd{display:flex;flex-direction:column;gap:10px;overflow:auto}

.ing{flex:1;min-height:0;overflow:hidden;background:var(--tint);border-radius:12px;padding:8px 18px;font-weight:700}
.ing .ir,.ing .ir1{font-size:inherit;padding:.15em 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.gh{margin:22px 0 10px;font-size:28px;color:var(--red);border-bottom:3px solid var(--red);padding-bottom:4px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{min-height:104px;border:3px solid var(--red);border-radius:14px;background:#fff;color:#000;font:inherit;font-size:24px;font-weight:700;padding:10px;cursor:pointer;text-align:center}
.tile small{display:block;font-size:18px;color:var(--red)}
.tile:active{background:var(--red);color:#fff}.tile:active small{color:#fff}
.ov{position:fixed;inset:0;z-index:50;background:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;overflow:auto}
.ov textarea{margin:0 0 14px;min-height:200px}
.sp{display:block;width:100%;height:auto;border:2px solid var(--red);border-radius:12px}
.zoom{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;margin:0 0 8px}
.sopt h4{margin:6px 0 8px;font-size:28px;color:var(--red)}

.sopt ol.steps{padding-left:0}.sopt ol.steps ul{padding-left:20px}
.empty{border:3px dashed var(--red);border-radius:14px;padding:20px;max-width:820px}
.row{display:flex;align-items:center;gap:14px;min-height:92px;padding:8px 12px;border-bottom:2px solid var(--line);max-width:820px}
.row.on{background:var(--tint)}
.row .nm{flex:1;font-weight:700}
.row small{display:block;font-weight:400;color:#222;font-size:20px}
.sw{position:relative;width:96px;height:56px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:28px;background:#fff;border:3px solid var(--red)}
.sw span::after{content:"";position:absolute;top:5px;left:5px;width:40px;height:40px;border-radius:50%;background:var(--red);transition:transform .15s}
.sw input:checked+span{background:var(--red)}
.sw input:checked+span::after{transform:translateX(40px);background:#fff}
.sw input:focus-visible+span{outline:4px solid #000;outline-offset:2px}
.ctr{display:flex;align-items:center;gap:8px}
.ctr button{width:72px;height:72px;border:3px solid var(--red);border-radius:12px;background:#fff;color:var(--red);font-size:30px;font-weight:700;cursor:pointer}
.ctr b{min-width:52px;text-align:center;font-size:36px}
input[type=search],textarea{width:100%;max-width:820px;font:inherit;padding:12px 14px;border:3px solid var(--red);border-radius:12px;margin:0 0 14px;background:#fff;color:var(--ink)}
.banner{background:var(--red);color:#fff;border-radius:12px;padding:14px 18px;margin:0 0 16px;font-weight:700;max-width:820px}
.sum{margin-top:24px;max-width:820px}
.sum ul{margin:8px 0 14px;padding-left:24px}
.note{color:#222;font-size:22px;max-width:820px}

.syn{color:#fff;font-weight:700;font-size:22px;margin:0 0 12px}

/* ---- food temperature log (San Jacinto) ---- */

const LOG_CHECKS = ['11:00 AM', '1:00 PM', '3:00 PM', '5:00 PM', '7:00 PM'];
const LOG_MINS = [660, 780, 900, 1020, 1140];
const LOG_EQUIP = ['Steam Table Bay 1', 'Steam Table Bay 2', 'Steam Table Bay 3', 'Food Warmer'];
const LOG_DOW = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const LOG_DEFAULT_ITEMS = [
  { equip: 'Steam Table Bay 1', food: 'Birria' }, { equip: 'Steam Table Bay 1', food: 'Consomé' },
  { equip: 'Steam Table Bay 2', food: 'Slot 1', flex: true }, { equip: 'Steam Table Bay 2', food: 'Slot 2', flex: true },
  { equip: 'Steam Table Bay 3', food: 'Beans' }, { equip: 'Steam Table Bay 3', food: 'Mexican Rice' },
  { equip: 'Food Warmer', food: 'Birria' }, { equip: 'Food Warmer', food: 'Consomé' }
];
const LOG_FAIL_BELOW = 135;

function logAddDays_(ds, n) {
  const p = ds.split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10);
}
function logMonday_(ds) {
  const p = ds.split('-');
  const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  return logAddDays_(ds, -((d.getUTCDay() + 6) % 7));
}

// layout = {start:'yyyy-mm-dd', items:[{equip,food,since?}]}; now = {date:'yyyy-mm-dd', min:minutes since midnight}
function logStats_(layout, entries, week, now) {
  const by = {};
  entries.forEach(function (e) {
    const k = e.date + '|' + e.check + '|' + e.equip + '|' + e.food;
    (by[k] = by[k] || []).push(e);
  });
  const items = layout.items.map(function (it, i) { return { it: it, i: i }; })
    .sort(function (a, b) { return (LOG_EQUIP.indexOf(a.it.equip) - LOG_EQUIP.indexOf(b.it.equip)) || (a.i - b.i); })
    .map(function (x) { return x.it; });
  const S = { total: 0, done: 0, passing: 0, missing: 0, pending: 0, failed: 0, actions: 0, empty: 0, discarded: 0, days: [], compliance: null };
  for (let d = 0; d < 7; d++) {
    const date = logAddDays_(week, d), slots = [];
    LOG_CHECKS.forEach(function (ck, ci) {
      items.forEach(function (it) {
        if (date < layout.start || (it.since && date < it.since) || (it.on && it.on !== date)) return;
        const list = by[date + '|' + ck + '|' + it.equip + '|' + it.food] || [];
        const mins = LOG_MINS[ci];
        const abs = date === now.date ? now.min : (date < now.date ? 99999 : -99999);
        let status, req = true;
        if (list.length) { const L = list[list.length - 1]; status = L.empty ? 'empty' : L.result === 'FAIL' ? (L.disd ? 'disc' : 'fail') : 'pass'; }
        else {
          status = abs >= mins + 120 ? 'missing' : abs >= mins - 30 ? 'pending' : 'future';
          if (it.flex) {
            // Flexible spot (Bay 2): empty by default. It only needs a temperature after food was logged in it
            // earlier the same day, and stops needing one once it is logged EMPTY (removed).
            let prior = null;
            for (let k = ci - 1; k >= 0 && !prior; k--) {
              const pl = by[date + '|' + LOG_CHECKS[k] + '|' + it.equip + '|' + it.food];
              if (pl && pl.length) prior = pl[pl.length - 1];
            }
            if (!(prior && !prior.empty)) { req = false; if (status !== 'future') status = 'idle'; }
          }
        }
        if (req || list.length) S.total++;
        if (list.length) S.done++;
        if (status === 'pass' || status === 'empty' || status === 'disc') S.passing++;
        if (status === 'empty') S.empty++;
        if (status === 'disc') S.discarded++;
        if (status === 'missing') S.missing++;
        if (status === 'pending') S.pending++;
        list.forEach(function (e) { if (e.result === 'FAIL') S.failed++; if (e.action) S.actions++; });
        slots.push({ date: date, check: ck, ci: ci, equip: it.equip, food: it.food, flex: !!it.flex, status: status, list: list });
      });
    });
    S.days.push({ date: date, dow: LOG_DOW[d], slots: slots });
  }
  const denom = S.done + S.missing;
  S.compliance = denom ? Math.round(S.passing * 1000 / denom) / 10 : null;
  return S;
}

function twHist_(cfg, weeks, now) {

    const st = twStats_(cfg, w.comps || [], [], w.week, now, w.week < cur), by = {};
    st.items.forEach(function (x) { if (x.st !== 'future') { x.week = w.week; items.push(x); } });

function twRecurring_(cfg, hist, min) {

// Fits one line of bold text into a width (mm): returns the font size in mm.

const r=new SR();r.lang=S.lang==='es'?'es-US':'en-US';r.interimResults=true;r.continuous=false;let fin='';
r.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++){s+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=s}const q=$('zq');if(q)q.value=s};
r.onend=()=>{ZEL.rec=null;const q=$('zq'),txt=(fin||(q&&q.value)||'').trim();zelRender();if(txt)zelAsk(txt)};
r.onerror=()=>{};ZEL.rec=r;try{r.start()}catch(e){ZEL.rec=null}zelRender()}
(function(){const d=document.createElement('div');d.id='zelwrap';d.innerHTML='<button type="button" id="zfab" class="zfab" aria-label="Zelyna"><span aria-hidden="true">✦</span> Zelyna</button><div id="zel"></div>';document.body.appendChild(d);
$('zfab').onclick=()=>{ZEL.open=true;zelRender()};
d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.id==='zx'){ZEL.open=false;try{speechSynthesis.cancel()}catch(x){}if(ZEL.rec)try{ZEL.rec.stop()}catch(x){}zelRender()}
else if(b.id==='zspk'){ZEL.speak=!ZEL.speak;try{localStorage.setItem('zel_voice',ZEL.speak?'1':'0');if(!ZEL.speak)speechSynthesis.cancel()}catch(x){}zelRender()}
else if(b.id==='zmic')zelMic();
else if(b.dataset.zq!==undefined)zelAsk(zt('sug')[+b.dataset.zq])});
d.addEventListener('submit',e=>{if(e.target.id!=='zf')return;e.preventDefault();const q=$('zq'),v=q?q.value:'';if(q)q.value='';zelAsk(v)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ZEL.open){ZEL.open=false;zelRender()}});
document.querySelector('.lang').addEventListener('click',()=>setTimeout(zelRender,0));
try{if(window.speechSynthesis)speechSynthesis.getVoices()}catch(e){}zelRender()})();
</script>
</body>
</html>
