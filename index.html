function tvLoad(force){if(!BACKEND)return;const n=Date.now();if(!force&&n-TV.at<60000)return;TV.at=n;fetch(BACKEND+'?action=tv&v='+encodeURIComponent(TV.v||'')).then(r=>r.json()).then(j=>{if(!j||!j.ok||j.same||!Array.isArray(j.videos))return;TV.v=j.v;TV.list=j.videos;TV.found=j.found!==false;try{localStorage.setItem('birriaz_tv',JSON.stringify({v:TV.v,list:TV.list,found:TV.found}))}catch(e){}if(cur==='videos'&&document.activeElement!==$('tvq'))videos(1);tvMark()}).catch(()=>{})}
const tvN=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function tvMatch(text,max){const n=' '+tvN(text)+' ';if(n.trim().length<3)return[];const out=[];TV.list.forEach(v=>{const k=tvN(v.title);if(k.length>=3&&(n.indexOf(' '+k+' ')>=0||(' '+k+' ').indexOf(n)>=0&&n.trim().length>=6))out.push(v)});return out.slice(0,max||3)}
function tvId(v){const l=(S.lang==='es')?'es':'en';return v[l]||v[l==='es'?'en':'es']||''}

o.innerHTML=`<div class="tvbx"><header><b>${esc(v.title)}</b>${v.en&&v.es?`<span class="pflg">${['en','es'].map(l=>`<button type="button" data-tvl="${l}" aria-pressed="${v[l]===id}">${l==='en'?'English':'Español'}</button>`).join('')}</span>`:''}<button type="button" class="tvx" aria-label="${t('Close')}">&#10005;</button></header><iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay; fullscreen" allowfullscreen title="${esc(v.title)}"></iframe></div>`;
o.addEventListener('click',e=>{const b=e.target.closest('button');if(e.target===o||(b&&b.classList.contains('tvx'))){o.remove();return}if(b&&b.dataset.tvl){o.querySelector('iframe').src='https://drive.google.com/file/d/'+v[b.dataset.tvl]+'/preview';o.querySelectorAll('[data-tvl]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}});document.body.appendChild(o)}

function cards(){if(cur==='recipes')return recipes();const k=cur,tt=t(SECS.find(s=>s[0]===k)[1]);let h=`<h2>${tt}</h2>`;if(k==='weekly')h+=`<div class="seg" role="group" aria-label="Day">${['Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>`<button data-wd="${d}" aria-pressed="${wd===d}">${t(d)}</button>`).join('')}</div>`;

/* ---- food temperature log (San Jacinto) ---- */

const LOG_CHECKS = ['11:00 AM', '1:00 PM', '3:00 PM', '5:00 PM', '7:00 PM'];
const LOG_MINS = [660, 780, 900, 1020, 1140];
const LOG_EQUIP = ['Steam Table Bay 1', 'Steam Table Bay 2', 'Steam Table Bay 3', 'Food Warmer'];
const LOG_DOW = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const LOG_DEFAULT_ITEMS = [
  { equip: 'Steam Table Bay 1', food: 'Birria' }, { equip: 'Steam Table Bay 1', food: 'Consomé' },
  { equip: 'Steam Table Bay 2', food: 'Slot 1', flex: true }, { equip: 'Steam Table Bay 2', food: 'Slot 2', flex: true },
  { equip: 'Steam Table Bay 3', food: 'Beans' }, { equip: 'Steam Table Bay 3', food: 'Mexican Rice' },
  { equip: 'Food Warmer', food: 'Birria' }, { equip: 'Food Warmer', food: 'Consomé' }
];
const LOG_FAIL_BELOW = 135;

function logAddDays_(ds, n) {
  const p = ds.split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10);
}
function logMonday_(ds) {
  const p = ds.split('-');
  const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  return logAddDays_(ds, -((d.getUTCDay() + 6) % 7));
}

// layout = {start:'yyyy-mm-dd', items:[{equip,food,since?}]}; now = {date:'yyyy-mm-dd', min:minutes since midnight}
function logStats_(layout, entries, week, now) {
  const by = {};
  entries.forEach(function (e) {
    const k = e.date + '|' + e.check + '|' + e.equip + '|' + e.food;
    (by[k] = by[k] || []).push(e);
  });
  const items = layout.items.map(function (it, i) { return { it: it, i: i }; })
    .sort(function (a, b) { return (LOG_EQUIP.indexOf(a.it.equip) - LOG_EQUIP.indexOf(b.it.equip)) || (a.i - b.i); })
    .map(function (x) { return x.it; });
  const S = { total: 0, done: 0, passing: 0, missing: 0, pending: 0, failed: 0, actions: 0, empty: 0, discarded: 0, days: [], compliance: null };
  for (let d = 0; d < 7; d++) {
    const date = logAddDays_(week, d), slots = [];
    LOG_CHECKS.forEach(function (ck, ci) {
      items.forEach(function (it) {
        if (date < layout.start || (it.since && date < it.since) || (it.on && it.on !== date)) return;
        const list = by[date + '|' + ck + '|' + it.equip + '|' + it.food] || [];
        const mins = LOG_MINS[ci];
        const abs = date === now.date ? now.min : (date < now.date ? 99999 : -99999);
        let status, req = true;
        if (list.length) { const L = list[list.length - 1]; status = L.empty ? 'empty' : L.result === 'FAIL' ? (L.disd ? 'disc' : 'fail') : 'pass'; }
        else {
          status = abs >= mins + 120 ? 'missing' : abs >= mins - 30 ? 'pending' : 'future';
          if (it.flex) {
            // Flexible spot (Bay 2): empty by default. It only needs a temperature after food was logged in it
            // earlier the same day, and stops needing one once it is logged EMPTY (removed).
            let prior = null;
            for (let k = ci - 1; k >= 0 && !prior; k--) {
              const pl = by[date + '|' + LOG_CHECKS[k] + '|' + it.equip + '|' + it.food];
              if (pl && pl.length) prior = pl[pl.length - 1];
            }
            if (!(prior && !prior.empty)) { req = false; if (status !== 'future') status = 'idle'; }
          }
        }
        if (req || list.length) S.total++;
        if (list.length) S.done++;
        if (status === 'pass' || status === 'empty' || status === 'disc') S.passing++;
        if (status === 'empty') S.empty++;
        if (status === 'disc') S.discarded++;
        if (status === 'missing') S.missing++;
        if (status === 'pending') S.pending++;
        list.forEach(function (e) { if (e.result === 'FAIL') S.failed++; if (e.action) S.actions++; });
        slots.push({ date: date, check: ck, ci: ci, equip: it.equip, food: it.food, flex: !!it.flex, status: status, list: list });
      });
    });
    S.days.push({ date: date, dow: LOG_DOW[d], slots: slots });
  }
  const denom = S.done + S.missing;
  S.compliance = denom ? Math.round(S.passing * 1000 / denom) / 10 : null;
  return S;
}

function twDayIdx_(ds) { const p = ds.split('-'); return (new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay() + 6) % 7; }
function twDayNum_(ds) { const p = ds.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
function twFind_(cfg, id) { for (let i = 0; i < cfg.tasks.length; i++) if (cfg.tasks[i].id === id) return cfg.tasks[i]; return null; }
// History-safe values: h = [{from:'YYYY-MM-DD', v:value}] in the order they were made. The last change dated on/before `date` wins.
function twAt_(h, date, dflt) { let v = dflt; if (h) for (let i = 0; i < h.length; i++) if (h[i].from <= date) v = h[i].v; return v; }
// Who owns ONE instance: a manager's one-time reassignment, else the employee assigned on that date (never rewritten by later changes).
function twEmpAt_(cfg, t, orig) { const o = cfg.iemp && cfg.iemp[t.id + '|' + orig]; if (o) return o; const v = twBase_(cfg, t, orig);
  if (!twAnyPos_(v)) { const e = cfg.employees.filter(function (x) { return x.name === v; })[0]; if (!(e && twHasWk_(e, orig) && !twWorks_(e, orig) && twPosN_(e.role))) return v; }   // named person working (or no schedule): unchanged
  return twSim_(cfg, t, orig); }
// ---- W: position tasks ("ANY COOK" / "ANY CASHIER" / "ANY DISHES") and same-position backup. Same code on the server and the tablet. ----
// An employee's position group comes from the Position typed on the EMPLOYEES tab (CASHIER 2 = Cashier, PM Cook = Cook).
function twPosOf_(role) { const r = String(role || '').toUpperCase(); return /CASH|CAJER/.test(r) ? 'CASHIER' : /COOK|COCIN|GRILL/.test(r) ? 'COOK' : /DISH|LAVA|PLATO|TRASTE/.test(r) ? 'DISHES' : ''; }
// AF: a "Who does it" can also be a position from the COLLAB POSITIONS list, with or without AM / PM in front (AM COOK, PM CASHIER, DIRECTOR...).
// It returns the role key the turns use: 'COOK', 'AM|COOK', 'PM|*' (PM SHIFT = anyone on PM). '' = not a role (a name).
const TW_LEG = ['CASHIER', 'COOK', 'DISHES', 'CAJERA', 'CAJERO', 'COCINERO', 'COCINERA'];
function twPosN_(r) { const s = String(r || '').trim().toUpperCase().replace(/\s+/g, ' ').replace(/^(AM|PM|MID) /, ''); return twPosOf_(s) || s; }
function twPosKeys_() { const L = (typeof twPosL_ === 'function' ? twPosL_() : []) || [], o = []; L.forEach(function (x) { const u = String(x || '').trim().toUpperCase().replace(/\s+/g, ' '); if (u) o.push(u, u.replace(/^(AM|PM|MID) /, '')); }); return o; }
function twAnyPos_(v) {
  const s = String(v || '').trim().toUpperCase().replace(/\s+/g, ' '); if (!s) return '';
  const m = /^ANY (CASHIER|COOK|DISHES)$/.exec(s); if (m) return m[1];
  const L = twPosKeys_(), sm = /^(AM|PM) (.+)$/.exec(s), core = sm ? sm[2] : s;
  const pos = sm && core === 'SHIFT' ? '*' : (L.indexOf(s) >= 0 || L.indexOf(core) >= 0 || TW_LEG.indexOf(core) >= 0) ? twPosN_(core) : '';
  return pos ? (sm ? sm[1] + '|' + pos : pos) : '';
}
// AM = the shift starts before 12 PM that day (from the schedule; no times = the Shift column)
function twShiftOn_(e, date) { const w = twWkOf_(e, date), s = w && w[twDayIdx_(date)]; if (s && s.length >= 2) return s[0] < 720 ? 'AM' : 'PM'; const x = String(e.shift || '').trim().toUpperCase(); return /^AM/.test(x) ? 'AM' : /^PM/.test(x) ? 'PM' : ''; }
function twWkOf_(e, date) { return e.wkH ? twAt_(e.wkH, date, null) : (e.wk || null); }
function twWorks_(e, date) { const w = twWkOf_(e, date), s = w && w[twDayIdx_(date)]; return !!(s && s.length >= 2); }
function twHasWk_(e, date) { const w = twWkOf_(e, date); return !!(w && w.some(function (s) { return s && s.length >= 2; })); }
// X: the position a person works on that date: the Role picked for that day on the schedule, else the Main position

// Task history across weeks. weeks = [{week, comps}] oldest first. Each scheduled instance appears ONCE, in the week it was due.
function twHist_(cfg, weeks, now) {
  const cur = logMonday_(now.date), items = [], summary = [];
  weeks.forEach(function (w) {
    const st = twStats_(cfg, w.comps || [], [], w.week, now, w.week < cur), by = {};
    st.items.forEach(function (x) { if (x.st !== 'future') { x.week = w.week; items.push(x); } });
    st.order.forEach(function (n) { const a = st.byEmp[n]; by[n] = { pct: a.pct, due: a.due, done: a.done, onTime: a.onTime, lateDone: a.lateDone, missing: a.missing, excused: a.excused }; });
    summary.push({ week: w.week, store: { pct: st.store.pct, due: st.store.due, done: st.store.done, onTime: st.store.onTime, lateDone: st.store.lateDone, missing: st.store.missing }, byEmp: by, order: st.order });
  });
  return { items: items, summary: summary };
}
// Tasks that were missed or finished late more than once in the history window (for schedule / assignment review).
function twRecurring_(cfg, hist, min) {
  const m = {};
  hist.items.forEach(function (x) {
    if (!m[x.tid]) m[x.tid] = { tid: x.tid, n: 0, miss: 0, late: 0, open: 0, emps: {} };
    const r = m[x.tid]; r.n++;
    if (x.st === 'overdue') { r.miss++; r.open++; r.emps[x.emp] = 1; } else if (x.lateDone) { r.late++; r.emps[x.emp] = 1; }
  });
  return Object.keys(m).map(function (k) { const r = m[k], t = twFind_(cfg, k) || {}; r.bad = r.miss + r.late; r.emp = t.emp; r.f = t.f; r.d = t.d || []; r.emps = Object.keys(r.emps); return r; })
    .filter(function (r) { return r.bad >= (min || 2); }).sort(function (a, b) { return b.bad - a.bad || b.open - a.open; });
}
function twMig_(cfg) { if (!cfg.mig) cfg.mig = []; let n = 0; TW_MIG.forEach(function (m) { if (cfg.mig.indexOf(m.id) < 0) { twApply_(cfg, m.o); cfg.mig.push(m.id); n++; } }); return n; }

.catch(()=>{let h='';try{h=localStorage.getItem('birriaz_schh')||''}catch(e){}if(SC.data&&h&&h===twH('s'+code)){ok(null);toast(t('Offline. Showing the schedule saved on this tablet.'),true)}else{SC.busy=0;SC.err=t('Offline. Check the Wi-Fi and try again.');sched()}})}

/* =====================================================================
   AN: EMPLOYEE BREAK TRACKER (operational tracking only: nothing here changes payroll)
   - Employee profile: 10 MIN / 20 MIN / 30 MIN / OVER MIN. Press a length to start, press it again to stop.
   - Times are saved as timestamps (on the tablet and on the Google script), so a refresh never loses a break.
   - Home: who is on break, with a live countdown, then the minutes over.
   - Report (manager mode): BREAKS section with a daily breakdown, records, and audited corrections.
   - Schedule: the week can start on any day (Schedule > Week).
   ===================================================================== */
const BK={act:[],q:[],last:{},ws:{s:1,e:0},v:0,busy:0,rep:null,key:'',wo:0,open:{},edit:'',err:'',rl:0};

const bkFmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

function bkOverMin(a,now){const o=bkSec(a,now)-a.mins*60;return o>0?Math.floor(o/60):0}

function bkOverTxt(N){const a=BK.act.find(x=>x.emp===N);if(a)return String(bkOverMin(a));const l=BK.last[N];return l&&l.d===ymd(new Date())?String(l.over):'0'}

const keepL=BK.act.filter(a=>qs[a.id]),srv=(act||[]).filter(a=>!qt[a.id]);srv.forEach(a=>{const o=BK.act.find(x=>x.id===a.id);if(o&&o.local)a.local=1});BK.act=srv.concat(keepL.filter(a=>!srv.some(s=>s.id===a.id)))}

// Black sticker: tries 1, 2 or 3 lines and keeps the layout with the biggest letters that still fit the label.
function bkFit(txt,W,H){const w=String(txt||'').trim().toUpperCase().split(/\s+/).filter(Boolean);if(!w.length)return{l:[''],f:5};
const ms=x=>{try{if(!fCtx)fCtx=document.createElement('canvas').getContext('2d');fCtx.font='900 100px Arial, Helvetica, sans-serif';return fCtx.measureText(x).width/100}catch(e){return x.length*.7}};
let best=null;const n=w.length,tr=L=>{const mw=Math.max(...L.map(ms))||1,f=Math.min(W*.95/mw,H/(L.length*1.02));if(!best||f>best.f+0.01)best={l:L,f:f}};
tr([w.join(' ')]);for(let a=1;a<n;a++){tr([w.slice(0,a).join(' '),w.slice(a).join(' ')]);for(let b=a+1;b<n;b++)tr([w.slice(0,a).join(' '),w.slice(a,b).join(' '),w.slice(b).join(' ')])}
best.f=Math.min(best.f,H*.8);return best}

const FLE={open:0,reg:null,blk:null,busy:0,nn:'',nd:'',nb:''};
function fleStart(){const L=fLbl(),it=fItems();FLE.reg=it.map(i=>({n:i.n,o:i.n,sl:i.src==='item'||i.src==='prep'||i.src==='category'?(+i.sl||''):''}));FLE.had=it.map(i=>i.n);FLE.blk=fBlk().slice();FLE.nn='';FLE.nd='';FLE.nb='';FLE.open=1;fleSort()}
function fleSort(){FLE.reg.sort((a,b)=>a.n<b.n?-1:a.n>b.n?1:0)}
function fleHtml(){if(!TK.mgr)return'';
if(!FLE.open)return`<section class="fuf2 fled"><h3 class="gh">&#9998; ${t('Edit the FIFO list')}</h3><p class="note">&#128275; ${t('Manager mode is on: add products, change the days (Expire in) or take a product off the label list. It saves to the PREP LIST tab.')}</p><button type="button" class="btn" id="fleo">&#9998; ${t('Edit the FIFO list')}</button></section>`;
const R=FLE.reg.map((x,i)=>`<div class="fler"><input type="text" maxlength="40" data-fln="${i}" value="${esc(x.n)}" aria-label="${t('Label name')}"${x.o?' readonly title="'+t('Rename it on the PREP LIST tab')+'"':''}><label class="fled2"><input type="number" min="1" max="60" inputmode="numeric" data-fld="${i}" value="${esc(String(x.sl||''))}" placeholder="6" aria-label="${t('Expire in (days)')}"><span>${t('days')}</span></label><button type="button" class="btn alt" data-flx="${i}">${t('Take off')}</button></div>`).join('');
const B=FLE.blk.map((x,i)=>`<div class="fler"><input type="text" maxlength="30" data-flb="${i}" value="${esc(x)}" aria-label="${t('Sticker text')}"><button type="button" class="btn alt" data-flbx="${i}">${t('Remove')}</button></div>`).join('');
return`<section class="fuf2 fled"><h3 class="gh">&#9998; ${t('Edit the FIFO list')}</h3><p class="note">${t('The list comes from the PREP LIST tab (items with FIFO label ticked). Days = Expire in (days): used-by date = today + days, 1 to 60. Empty = 6 days. A new product is added to the PREP LIST. Take off only unticks its FIFO label (the prep item stays). Names are changed on the PREP LIST tab.')}</p>
<div class="fler fleadd"><input type="text" id="flnn" maxlength="40" placeholder="${t('New product name')}" value="${esc(FLE.nn)}" aria-label="${t('New product name')}"><label class="fled2"><input type="number" id="flnd" min="1" max="60" inputmode="numeric" value="${esc(FLE.nd)}" placeholder="6" aria-label="${t('Expire in (days)')}"><span>${t('days')}</span></label><button type="button" class="btn" id="fladd">+ ${t('Add')}</button></div>
<h4>${t('Products')} (${FLE.reg.length})</h4><div class="flel"><div class="fler fleh"><span>${t('Product')}</span><span>${t('Expire in (days)')}</span><span></span></div>${R||`<p class="note">${t('No products yet.')}</p>`}</div>
<h4>${t('Black stickers')} (${FLE.blk.length})</h4><div class="flel">${B}</div><div class="fler fleadd"><input type="text" id="flnb" maxlength="30" placeholder="${t('New sticker text')}" value="${esc(FLE.nb)}" aria-label="${t('New sticker text')}"><button type="button" class="btn" id="fladdb">+ ${t('Add')}</button></div>
<div class="fleb"><button type="button" class="btn" id="flsave" ${FLE.busy?'disabled':''}>${FLE.busy?t('Saving...'):'&#10003; '+t('Save the FIFO list')}</button><button type="button" class="btn alt" id="flcancel">${t('Cancel')}</button></div></section>`}
function fleBind(){const o=$('fleo');if(o)o.onclick=()=>{fleStart();keep(fifo);const s=document.querySelector('.fled');if(s)s.scrollIntoView({block:'start'})};if(!FLE.open||!TK.mgr)return;
const up=(sel,fn)=>document.querySelectorAll(sel).forEach(e=>e.oninput=()=>fn(e));
const RG=FLE.reg.slice();   /* each box edits its own product (not a position), so a redraw can never write into another row */
up('[data-fln]',e=>{RG[+e.dataset.fln].n=e.value});up('[data-fld]',e=>{RG[+e.dataset.fld].sl=e.value});up('[data-flb]',e=>{FLE.blk[+e.dataset.flb]=e.value});
document.querySelectorAll('[data-fln]').forEach(e=>e.onchange=()=>{const o=RG[+e.dataset.fln];if(FLE.reg.indexOf(o)<0)return;o.n=e.value.trim().toUpperCase().replace(/\s+/g,' ');if(FLE._rs)return;FLE._rs=1;setTimeout(()=>{FLE._rs=0;if(!FLE.open)return;fleSort();keep(fifo)},0)});
const nn=$('flnn'),nd=$('flnd'),nb=$('flnb');nn.oninput=()=>FLE.nn=nn.value;nd.oninput=()=>FLE.nd=nd.value;nb.oninput=()=>FLE.nb=nb.value;
const add=()=>{const n=FLE.nn.trim().toUpperCase().replace(/\s+/g,' ').slice(0,40);if(!n){nn.focus();return}if(FLE.reg.some(x=>x.n.trim().toUpperCase()===n)){toast(t('That product is already on the list.'),true);return}FLE.reg.push({n:n,sl:FLE.nd});fleSort();FLE.nn='';FLE.nd='';keep(fifo);const f=$('flnn');if(f)f.focus()};
$('fladd').onclick=add;nn.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};nd.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
const addb=()=>{const n=FLE.nb.trim().toUpperCase().replace(/\s+/g,' ').slice(0,30);if(!n){nb.focus();return}if(FLE.blk.some(x=>String(x).toUpperCase()===n)){toast(t('That sticker is already on the list.'),true);return}FLE.blk.push(n);FLE.nb='';keep(fifo)};
$('fladdb').onclick=addb;nb.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addb()}};
document.querySelectorAll('[data-flx]').forEach(b=>b.onclick=()=>{const k=FLE.reg.indexOf(RG[+b.dataset.flx]);if(k>=0)FLE.reg.splice(k,1);keep(fifo)});
document.querySelectorAll('[data-flbx]').forEach(b=>b.onclick=()=>{FLE.blk.splice(+b.dataset.flbx,1);keep(fifo)});
$('flcancel').onclick=()=>{FLE.open=0;FLE.reg=null;FLE.blk=null;keep(fifo)};
$('flsave').onclick=()=>{if(FLE.busy)return;const reg=FLE.reg.map(x=>({n:String(x.n||'').trim().toUpperCase().replace(/\s+/g,' '),o:x.o||'',sl:Math.round(+x.sl)||0})).filter(x=>x.n);
const bad=reg.find(x=>x.sl&&(x.sl<1||x.sl>60));if(bad){toast(t('Shelf life must be a whole number of days from 1 to 60.')+' '+bad.n,true);return}
const seen={};const dup=reg.find(x=>seen[x.n]||!(seen[x.n]=1));if(dup){toast(t('That product is on the list twice:')+' '+dup.n,true);return}
FLE.busy=1;keep(fifo);post({action:'lblSet',pin:TK.pin,reg:reg,had:FLE.had||[],blk:FLE.blk.map(x=>String(x||'').trim()).filter(Boolean)}).then(j=>{FLE.busy=0;
if(!j||!j.ok){toast((j&&j.error==='unknown action')?t('The Google script is not updated yet. Paste the new Code.gs in Apps Script, then deploy a new version.'):(j&&j.error==='wrong manager code')?t('Manager mode expired. Turn it on again.'):((j&&j.error)||t('Could not save. Check the Wi-Fi and try again.')),true);keep(fifo);return}
if(PCFG){PCFG.labels=j.labels;try{localStorage.setItem('birriaz_pc',JSON.stringify(PCFG))}catch(e){}}FLE.open=0;FLE.reg=null;FLE.blk=null;toast(t('FIFO list saved.'));keep(fifo)}).catch(()=>{FLE.busy=0;toast(t('Could not save. Check the Wi-Fi and try again.'),true);keep(fifo)})}}

/* ===== AM2: prices are for managers only. The backend checks the code on every price request; the tablet also forgets
   price data when the manager screens lock, and removes Zelyna's price answers when manager mode is off. ===== */
function zmMgrOn(){return !!((typeof TK!=='undefined'&&TK.mgr&&TK.pin)||ivActive())}
function zmMpin(){return ivActive()?IV.pin:''}
function zmPurge(noRender){if(zmMgrOn()||!ZEL.msgs.some(m=>m.priv))return;const out=[];ZEL.msgs.forEach(m=>{if(m.priv){if(out.length&&out[out.length-1].r==='u')out.pop();return}out.push(m)});ZEL.msgs=out;if(!noRender){try{zelRender()}catch(e){}}}
function zmForget(){ZM.cat=null;ZM.intel=null;ZM.doc=null;ZM.thumbs=[];ZM.pages=[];ZM.qs=null;ZM.need=[];if(ZM.sp)ZM.sp.data=null}
const zmLock0=ivLock;ivLock=function(){zmLock0();zmForget();zmPurge()};

else{const mx=Math.max(0,...J.vendors.map(v=>v.total));

const tr=(L,lab)=>{const mx=Math.max(0,...L.map(x=>x.total));return `<table class="ivt zsg">${L.map(x=>`<tr><td>${lab(x)}</td><td>${zmM(x.total)}</td><td>${zmBar(x.total,mx)}</td></tr>`).join('')}</table>`};
h+=`<h3>${t('Weekly spending')} <small>(${t('12 weeks, Monday to Sunday')})</small></h3>`+tr(J.weeks.slice().reverse(),w=>`${zmD(w.from)} – ${zmD(w.to)}`);
h+=`<h3>${t('Monthly spending')} <small>(${t('12 months')})</small></h3>`+tr(J.months.slice().reverse(),m=>esc(m.m));
return h+`<p class="note">${t('Counts only manager-approved invoices, receipts and delivery records, each line once, by the date on the document. Sent orders, price lists, pending and rejected documents are never counted. Tax and lines marked as not inventory are not included.')}</p>`}
function zmSpendWire(o){const P=ZM.sp;
o.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{P.period=b.dataset.sp;P.off=0;if(P.period==='custom'){if(!P.from){const d=P.data&&P.data.from?P.data:null;P.from=d?d.from:'';P.to=d?d.to:''}if(!P.from||!P.to){P.data={};P.err='';zmIntelDraw();return}}zmSpendLoad()});
o.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{P.view=b.dataset.sv;zmIntelDraw()});
o.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{P.group=P.group===b.dataset.sg?'':b.dataset.sg;zmSpendLoad()});
o.querySelectorAll('[data-vv]').forEach(b=>b.onclick=()=>{P.vendor=P.vendor===b.dataset.vv?'':b.dataset.vv;zmSpendLoad()});
const a=$('zsall');if(a)a.onclick=()=>{P.group='';P.vendor='';zmSpendLoad()};
const pv=$('zsprev');if(pv)pv.onclick=()=>{P.off--;zmSpendLoad()};const nx=$('zsnext');if(nx)nx.onclick=()=>{if(P.off<0){P.off++;zmSpendLoad()}};
const go=$('zsgo');if(go)go.onclick=()=>{P.from=$('zsf').value;P.to=$('zst').value;if(!P.from||!P.to){toast(t('Pick a start date and an end date.'),true);return}if(P.from>P.to){toast(t('The start date is after the end date.'),true);return}zmSpendLoad()}}
